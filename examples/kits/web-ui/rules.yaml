rules:
  - id: no-hardcoded-hex
    pattern: "#[0-9a-fA-F]{3,8}\\b"
    files: "**/*.{css,scss,less,styl}"
    severity: minor
    message: "Use a design token instead of a hardcoded hex color"
  - id: no-any-type
    pattern: ":\\s*any\\b|<any>|as any\\b"
    files: "**/*.{ts,tsx}"
    severity: major
    message: "Replace `any` with a real type or `unknown`"
